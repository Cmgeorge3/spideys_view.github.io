<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spidey's View - Photo Service</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Bangers', "Comic Sans MS", Sans serif;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 3em;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
      font-size: 1.2em;
      margin: 10px 0 0 0;
    }

    /* Holds the form and image side-by-side */
    .page-container {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Form section */
    .form-container {
      flex: 1;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* Image section */
    .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .right-image {
      width: 100%;
      max-width: 950px;
      height: 650px;
      object-fit: fill;
      border: 5px solid white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    table {
      width: 100%;
      margin-bottom: 20px;
      border-collapse: collapse;
      background: #f9f9f9;
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border: 2px solid #667eea;
    }

    table th {
      background-color: #667eea;
      color: white;
    }

    table tr:nth-child(even) {
      background-color: #f0f0f0;
    }

    h2 {
      color: #764ba2;
      margin-top: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 2px solid #667eea;
      border-radius: 5px;
      font-family: inherit;
      font-size: 1em;
      box-sizing: border-box;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #764ba2;
      box-shadow: 0 0 5px rgba(118, 75, 162, 0.3);
    }

    /* Submit button */
    button {
      transition: all 0.3s ease;
      color: white;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 12px 30px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      font-weight: bold;
      margin-top: 20px;
      width: 100%;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(118, 75, 162, 0.4);
    }

    /* Status message styling */
    #status {
      margin-top: 20px;
      font-weight: bold;
      padding: 15px;
      border-radius: 5px;
      display: none;
    }

    #status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      display: block;
    }

    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
      display: block;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 15px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    .back-link:hover {
      background: #f0f0f0;
      transform: translateX(-5px);
    }

    /* Makes the page work better on phones */
    @media (max-width: 800px) {
      .header h1 {
        font-size: 2em;
      }

      .page-container {
        flex-direction: column;
      }

      .image-container {
        width: 100%;
      }

      .right-image {
        max-width: 100%;
        height: auto;
      }

      .form-container {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>📸 Spidey's View</h1>
    <p>Professional Photo Services</p>
    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <div class="page-container">

    <!-- FORM ON THE LEFT -->
    <div class="form-container">

      <form id="serviceForm" action="https://formspree.io/f/xkjnlybg" method="POST">

        <table>
          <tr>
            <th>📷 Job Type</th>
            <th>💰 Price per Task</th>
          </tr>

          <tr>
            <td>Full Body / Landscape</td>
            <td>$8</td>
          </tr>

          <tr>
            <td>Head-Shots</td>
            <td>$15</td>
          </tr>
          <tr>
            <td>Group Photos</td>
            <td>$20</td>
          </tr>

        </table>

        <h2>📞 Schedule Your Photo Session</h2>
        <p><strong>Call to confirm your date:</strong> (252)-499-0867</p>

        <label for="jobType">Choose Job Type:</label>
        <select id="jobType" name="jobType" required>
          <option value="">-- Select a Job --</option>
          <option value="full-body">Full Body / Landscape</option>
          <option value="Headshot">Head-Shots</option>
          <option value="Group">Group Photos</option>
        </select>

        <label for="serviceTypes">Choose Mobile or Local Services:</label>
        <select id="serviceTypes" name="serviceTypes" required>
          <option value="">-- Select Service Type --</option>
          <option value="Come To me">Come To Me</option>
          <option value="Come to you">Come to You</option>
        </select>

        <label for="address">Address of Venue:</label>
        <input
          type="text"
          id="address"
          name="address"
          placeholder="Enter the venue address"
          required
        >

        <label for="email">Your Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="your.email@example.com"
          required
        >

        <label for="phone">Your Phone Number:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="(123) 456-7890"
          required
        >

        <button type="submit">Submit Form</button>

        <div id="status"></div>

      </form>

    </div>


    <!-- IMAGE ON THE RIGHT -->
    <div class="image-container">

      <img
        src="./Spideys_view_photo.png"
        alt="Spidey's View Photo Service"
        class="right-image"
      >

    </div>

  </div>

  <script>
    document.getElementById('serviceForm').addEventListener('submit', function(e) {
      const statusDiv = document.getElementById('status');
      statusDiv.textContent = 'Submitting your form...';
      statusDiv.className = '';
    });
  </script>

</body>
</html>
